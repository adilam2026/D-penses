appId: com.depenses.mobile
---
# Flow de DIAGNOSTIC uniquement — revisite en LECTURE SEULE la case
# "Voyage" du Planning, sans retaper sur planning-confirm-pay. Doit être
# exécuté APRÈS 90-diagnostic-planning-juste-apres.yaml (qui a déjà tapé
# planning-confirm-pay dans cette même campagne ciblée) — retaper ici
# échouerait différemment puisque la case n'est plus PENDING. Attend
# explicitement (extendedWaitUntil, optional pour ne pas faire échouer la
# campagne ciblée si "✓" n'apparaît jamais) puis capture l'état final —
# "après attente réseau". Hors de mobile/e2e/maestro/flows/.
- runFlow: ../flows/common/login.yaml
- tapOn: "Planning"
- scrollUntilVisible:
    element:
      id: "planning-cell-voyage-2026-12"
    direction: RIGHT
- extendedWaitUntil:
    visible: "✓"
    timeout: 15000
    optional: true
- takeScreenshot: diagnostic-planning-realiser-revisite
