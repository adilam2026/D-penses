appId: com.depenses.mobile
---
# Flow de DIAGNOSTIC uniquement — revisite en LECTURE SEULE la case
# "Voyage" du Planning, sans retaper sur planning-confirm-pay. Doit être
# exécuté APRÈS la campagne des 21 flows : 12-planning-tap-realiser.yaml y a
# déjà confirmé le paiement avec succès (seule l'assertion finale "✓"
# échouait) — retaper ici échouerait différemment puisque la case n'est plus
# PENDING. Vérifie si la coche "✓" est présente une fois l'écran rechargé
# sans contrainte de temps. Hors de mobile/e2e/maestro/flows/.
- runFlow: ../flows/common/login.yaml
- tapOn: "Planning"
- scrollUntilVisible:
    element:
      id: "planning-cell-voyage-2026-12"
    direction: RIGHT
- takeScreenshot: diagnostic-planning-realiser-revisite
