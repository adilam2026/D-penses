appId: com.depenses.mobile
---
# Flow de DIAGNOSTIC uniquement — campagne ciblée "animations réactivées".
# Ouvre le sélecteur "Compte bancaire support" puis tente optionnellement
# de sélectionner "CIH" (optional: true — n'échoue pas la campagne ciblée
# si l'option n'apparaît toujours pas). Hors de mobile/e2e/maestro/flows/.
- runFlow: ../flows/common/login.yaml
- tapOn:
    id: "app-shell-menu-button"
- tapOn:
    id: "menu-row-epargne-sous-comptes"
- scrollUntilVisible:
    element:
      id: "savings-subaccounts-add-global"
    direction: DOWN
- tapOn:
    id: "savings-subaccounts-add-global"
- assertVisible: "Nouveau sous-compte"
- tapOn:
    id: "create-subaccount-name"
- inputText: "Sous-compte E2E Maestro Diagnostic Anim"
- tapOn:
    id: "create-subaccount-account"
- takeScreenshot: diagnostic-subcompte-anim-selector-open
- tapOn:
    text: "^CIH$"
    optional: true
- takeScreenshot: diagnostic-subcompte-anim-after-cih-attempt
