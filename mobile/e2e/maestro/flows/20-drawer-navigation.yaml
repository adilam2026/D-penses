- assertVisible: "Menu"
- assertVisible:
    id: "menu-row-comptes"
- assertVisible:
    id: "menu-row-epargne-sous-comptes"
- assertVisible:
    id: "menu-row-categories"
- assertVisible:
    id: "menu-row-plans-financiers"
- assertVisible:
    id: "menu-row-parametres"
- assertVisible:
    id: "menu-row-guide"
