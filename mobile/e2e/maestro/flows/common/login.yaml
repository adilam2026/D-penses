appId: com.depenses.mobile
---
# Sous-flow réutilisable (appelé via runFlow) : première connexion sur un
# appareil vierge avec le compte de démonstration E2E — email, puis code à
# 6 chiffres sur le pavé numérique (validation automatique au 6e chiffre).
# ${E2E_EMAIL} / ${E2E_PIN} sont injectés par le workflow android-e2e.yml
# (E2E_PIN = secret GitHub, jamais dans Git). clearState garantit que chaque
# flow top-level repart d'une app fraîchement installée (aucune session ni
# profil mémorisé d'un flow précédent), pour rester rejouable isolément.
- launchApp:
    clearState: true
- takeScreenshot: common-login-post-launch
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: "${E2E_EMAIL}"
- hideKeyboard
- tapOn:
    id: "login-continue"
- assertVisible:
    id: "pin-pad"
- runFlow:
    file: enter-digits.yaml
    env:
      DIGITS: ${E2E_PIN}
- runFlow:
    file: pin-setup-if-required.yaml
    env:
      NEW_PIN: ${E2E_PIN}
- assertVisible:
    text: "MES COMPTES"
