appId: com.depenses.mobile
---
# Parcours 21 — Déconnexion puis reconnexion
- runFlow: common/login.yaml
- tapOn:
    id: "app-shell-menu-button"
- tapOn:
    id: "menu-row-deconnexion"
- assertVisible:
    id: "login-email"
    timeout: 10000
- tapOn:
    id: "login-email"
- inputText: "${E2E_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${E2E_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible:
    text: "MES COMPTES"
    timeout: 15000
