appId: com.depenses.mobile
---
# Parcours 21 — Déconnexion puis reconnexion
# Après déconnexion, la personne déjà connue de l'appareil est proposée par
# son prénom : son écran de code s'affiche (prénom, jamais l'email), code à
# 6 chiffres, retour à l'application.
- runFlow: common/login.yaml
- tapOn:
    id: "app-shell-menu-button"
- tapOn:
    id: "menu-row-deconnexion"
- assertVisible:
    id: "login-email"
- tapOn:
    text: "Continuer en tant que .*"
- assertVisible:
    id: "lock-screen"
- assertVisible:
    id: "lock-name"
- assertNotVisible:
    text: "${E2E_EMAIL}"
- runFlow:
    file: common/enter-digits.yaml
    env:
      DIGITS: ${E2E_PIN}
- assertVisible:
    text: "MES COMPTES"
