appId: com.depenses.mobile
---
# Parcours 8 — Revenu
- runFlow: common/login.yaml
- tapOn: "Ajouter"
- tapOn:
    id: "ajouter-tile-INCOME"
- tapOn:
    id: "ajouter-tab-realisee"
- tapOn:
    id: "ajouter-amount"
- inputText: "500"
- tapOn:
    text: "Choisir une date"
- tapOn:
    text: "^OK$"
- tapOn:
    id: "ajouter-label"
- inputText: "Revenu E2E Maestro"
- hideKeyboard
- tapOn:
    id: "ajouter-destination"
- tapOn:
    text: "^CIH$"
- tapOn:
    id: "ajouter-category"
- tapOn:
    text: "Prime"
- tapOn:
    id: "ajouter-submit"
- assertVisible:
    text: "MES COMPTES"
