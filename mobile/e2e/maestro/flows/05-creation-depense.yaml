appId: com.depenses.mobile
---
# Parcours 5 — Création d'une dépense réalisée
#
# Note sur la date : DateField ouvre le sélecteur natif Android
# (DateTimePickerAndroid), une boîte de dialogue système — jamais un champ
# texte libre. Le bouton positif de cette boîte est ciblé par son libellé
# visible ("OK") plutôt que par android:id/button1 : ce dernier s'est avéré
# intermittent en CI (l'id de ressource AOSP existe bien, mais le tap
# échouait sporadiquement selon le timing de rendu du dialogue). La date du
# jour est pré-sélectionnée par défaut.
- runFlow: common/login.yaml
- tapOn: "Ajouter"
- assertVisible:
    id: "ajouter-tile-EXPENSE"
- tapOn:
    id: "ajouter-tile-EXPENSE"
- tapOn:
    id: "ajouter-tab-realisee"
- tapOn:
    id: "ajouter-amount"
- inputText: "150"
- tapOn:
    text: "Choisir une date"
- tapOn:
    text: "^OK$"
- tapOn:
    id: "ajouter-label"
- inputText: "Dépense E2E Maestro"
- hideKeyboard
- tapOn:
    id: "ajouter-source"
- tapOn:
    text: "^CIH$"
- tapOn:
    id: "ajouter-category"
- tapOn:
    text: "Courses"
- tapOn:
    id: "ajouter-submit"
- assertVisible:
    text: "MES COMPTES"
