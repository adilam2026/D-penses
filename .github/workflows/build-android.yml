name: Build Android APK (Lot 9 — recette manuelle)

# Le sandbox Claude Code ne dispose ni du SDK Android ni d'un accès réseau à
# dl.google.com/api.expo.dev. Ce workflow délègue le VRAI build natif à un
# runner GitHub Actions standard, qui dispose des deux. Déclenchement manuel
# uniquement (workflow_dispatch) — ce n'est pas un build à chaque push.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: >
          URL publique HTTPS du backend (EXPO_PUBLIC_API_URL) que l'APK doit
          appeler, ex. https://d-penses-production.up.railway.app (sans slash
          final). Obligatoire — un build avec cette valeur absente, vide,
          localhost/127.0.0.1/10.0.2.2 ou non-HTTPS est refusé avant même de
          lancer le build natif (cf. étape "Valider EXPO_PUBLIC_API_URL").
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Valider EXPO_PUBLIC_API_URL (fail-fast, avant tout build)
        # Un build ne doit jamais pouvoir être déclaré valide avec une
        # API_BASE_URL vide, localhost, ou non-HTTPS embarquée dans l'APK —
        # vérifié ici en quelques secondes, avant les ~10 minutes de build
        # natif, plutôt que découvert après coup dans le bundle.
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::api_url est vide — build refusé (EXPO_PUBLIC_API_URL ne doit jamais être vide)"
            exit 1
          fi
          if ! printf '%s' "$API_URL" | grep -qE '^https://'; then
            echo "::error::api_url doit être une URL HTTPS publique (reçu: $API_URL)"
            exit 1
          fi
          if printf '%s' "$API_URL" | grep -qiE '(localhost|127\.0\.0\.1|10\.0\.2\.2)'; then
            echo "::error::api_url ne doit jamais référencer localhost/127.0.0.1/10.0.2.2 (reçu: $API_URL)"
            exit 1
          fi
          echo "api_url validée : $API_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances (mobile)
        run: npm ci

      - name: Typecheck (validation avant build, aucune règle métier)
        run: npx tsc --noEmit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Générer le projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK RELEASE (bundle JS embarqué, signé avec la debug keystore)
        # RELEASE, pas debug (§1 correctif) : un APK debug charge son JS depuis un
        # serveur Metro (localhost:8081) au lancement — jamais autonome sur device.
        # Le plugin Gradle React Native bundle le JS et l'embarque dans les assets
        # UNIQUEMENT pour le variant release (bundleInRelease=true par défaut,
        # bundleInDebug=false par défaut) — c'est la cause exacte de l'écran rouge
        # "Unable to load script" observé avec assembleDebug.
        # Recette interne (§3) : signingConfigs.release référence déjà
        # signingConfigs.debug dans le android/app/build.gradle généré par Expo
        # prebuild — aucun keystore de production à créer pour ce build.
        working-directory: mobile/android
        env:
          # Validée (non vide, HTTPS, jamais localhost/127.0.0.1/10.0.2.2) par
          # l'étape "Valider EXPO_PUBLIC_API_URL" ci-dessus, qui a déjà fait
          # échouer le build avant d'en arriver ici si ce n'était pas le cas.
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon | tee build-release.log

      - name: Confirmer factuellement que le bundle JS release a été exécuté
        working-directory: mobile/android
        run: |
          grep -Eq ':app:(createBundleReleaseJsAndAssets|bundleReleaseJsAndAssets)' build-release.log \
            || (echo "Tâche de bundling JS release absente du log — le JS ne serait pas embarqué" && exit 1)
          grep -E ':app:(createBundleReleaseJsAndAssets|bundleReleaseJsAndAssets)' build-release.log

      - name: Vérifier que l'APK existe, n'est pas vide, et contient réellement le bundle JS
        working-directory: mobile
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || (echo "APK manquant ou vide: $APK" && exit 1)
          ls -la "$APK"
          # Preuve factuelle (pas seulement "Gradle SUCCESS") : le bundle JS doit
          # être un fichier réel et non vide DANS l'APK, pas seulement une tâche
          # Gradle exécutée sans effet.
          unzip -l "$APK" | grep -E "assets/index\.android\.bundle" \
            || (echo "assets/index.android.bundle absent de l'APK — JS non embarqué" && exit 1)
          unzip -l "$APK" | grep -E "assets/index\.android\.bundle"

      - name: Confirmer l'absence de localhost dans le bundle JS embarqué + empreinte SHA-256 de l'APK
        # Preuve factuelle demandée avant livraison (recette manuelle) : le bundle JS
        # RÉELLEMENT embarqué (pas le code source) ne doit contenir aucune URL basée sur
        # localhost/127.0.0.1/10.0.2.2 — l'URL backend utilisée à l'exécution est celle
        # injectée dans EXPO_PUBLIC_API_URL au build (étape précédente), jamais un repli
        # caché. Le motif est ancré sur le schéma http(s):// (jamais un simple mot-clé)
        # car ce bundle minifié concatène des milliers de noms d'icônes/chaînes RN sans
        # séparateur — un premier essai avec "localhost" nu a donné un faux positif sur
        # "...source-commit-local" + "host component..." accolés par hasard, aucune URL
        # réelle. Calcule aussi le SHA-256 de l'APK réel (pas de l'archive zip d'upload).
        working-directory: mobile
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          rm -rf /tmp/apk-bundle-check && mkdir -p /tmp/apk-bundle-check
          unzip -p "$APK" assets/index.android.bundle > /tmp/apk-bundle-check/index.android.bundle
          if grep -aiE "https?://(localhost|127\.0\.0\.1|10\.0\.2\.2)" /tmp/apk-bundle-check/index.android.bundle; then
            echo "URL localhost/127.0.0.1/10.0.2.2 trouvée dans le bundle JS embarqué — build refusé" && exit 1
          fi
          echo "Aucune URL localhost/127.0.0.1/10.0.2.2 dans assets/index.android.bundle"
          # Preuve positive : l'URL backend validée doit être réellement présente
          # dans le bundle JS embarqué (pas seulement injectée sans effet).
          if ! grep -aF "$API_URL" /tmp/apk-bundle-check/index.android.bundle > /dev/null; then
            echo "::error::$API_URL absente du bundle JS embarqué — EXPO_PUBLIC_API_URL n'a pas été réellement embarquée"
            exit 1
          fi
          echo "URL backend confirmée présente dans assets/index.android.bundle : $API_URL"
          echo "SHA-256 (APK réel, pas l'archive d'upload) :"
          sha256sum "$APK"

      - name: Diagnostic non-bloquant — vérifier que le bundle contient bien les chaînes R6
        # Étape strictement diagnostique (CI uniquement, aucun impact sur le contenu de
        # l'APK) : recherche dans le bundle JS RÉELLEMENT embarqué des chaînes visibles
        # ajoutées par la passe R6 (boutons "CONFIRMER LE PAIEMENT"/"CONFIRMER LE
        # TRANSFERT", introduits dans ce lot) — preuve factuelle que le JS packagé
        # correspond bien au code source de ce commit, pas à un bundle plus ancien.
        # N'échoue jamais le build (|| true) : sert uniquement à lire le résultat dans
        # les logs du job.
        working-directory: mobile
        run: |
          echo "--- Recherche de chaînes R6 dans le bundle JS embarqué ---"
          grep -ac "CONFIRMER LE PAIEMENT" /tmp/apk-bundle-check/index.android.bundle \
            && echo "OK: 'CONFIRMER LE PAIEMENT' trouvé dans le bundle" \
            || echo "ABSENT: 'CONFIRMER LE PAIEMENT' introuvable dans le bundle"
          grep -ac "CONFIRMER LE TRANSFERT" /tmp/apk-bundle-check/index.android.bundle \
            && echo "OK: 'CONFIRMER LE TRANSFERT' trouvé dans le bundle" \
            || echo "ABSENT: 'CONFIRMER LE TRANSFERT' introuvable dans le bundle"
          true

      - uses: actions/upload-artifact@v4
        with:
          name: depenses-android-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
