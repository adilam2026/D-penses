name: Railway — Vérification publique (health + smoke test OTP)

# Exécuté depuis un runner GitHub Actions (accès réseau normal, contrairement
# au bac à sable) pour prouver que le backend est réellement joignable
# publiquement — jamais depuis localhost/le conteneur lui-même.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL HTTPS publique du backend (sans slash final), ex. https://d-penses-production.up.railway.app"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          set -o pipefail
          code=$(curl -sS -o body.json -w "%{http_code}" "${{ github.event.inputs.api_url }}/health")
          echo "HTTP $code"
          cat body.json
          echo
          test "$code" = "200"

      - name: Smoke test auth — signup public (aucun token/secret impliqué)
        run: |
          set -o pipefail
          email="railway-smoke+$(date +%s)@example.com"
          echo "Email de test jetable : $email"
          code=$(curl -sS -o signup.json -w "%{http_code}" -X POST "${{ github.event.inputs.api_url }}/auth/signup" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"password123\",\"firstName\":\"Smoke\",\"lastName\":\"Test\"}")
          echo "HTTP $code"
          cat signup.json
          echo
          test "$code" = "201"
          grep -q '"requiresEmailVerification":true' signup.json

      - name: Smoke test auth — verify-email-otp avec un code volontairement invalide (prouve le pipeline complet sans connaître le vrai code reçu par email)
        run: |
          set -o pipefail
          email="railway-smoke+$(date +%s)-b@example.com"
          curl -sS -o /dev/null -w "signup: %{http_code}\n" -X POST "${{ github.event.inputs.api_url }}/auth/signup" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"password123\",\"firstName\":\"Smoke\",\"lastName\":\"Test\"}"
          code=$(curl -sS -o verify.json -w "%{http_code}" -X POST "${{ github.event.inputs.api_url }}/auth/verify-email-otp" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"code\":\"000000\"}")
          echo "HTTP $code"
          cat verify.json
          echo
          test "$code" = "400"
          grep -q "invalide ou a expiré" verify.json

      - name: Login compte de démonstration Finance Maison (prouve seed + schéma + auth)
        # Les tokens JWT retournés ne sont jamais affichés dans les logs (grep -c
        # au lieu de cat) — seule leur présence est vérifiée.
        run: |
          set -o pipefail
          code=$(curl -sS -o login.json -w "%{http_code}" -X POST "${{ github.event.inputs.api_url }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@finance-maison.local","password":"DemoFinanceMaison2026!"}')
          echo "HTTP $code"
          test "$code" = "201" || test "$code" = "200"
          grep -q '"accessToken"' login.json
          grep -q '"refreshToken"' login.json
          echo "Login démo OK — accessToken/refreshToken présents (valeurs non journalisées)"

      - name: /planning et /todo répondent sans erreur (migrations responsible_source appliquées)
        # /planning et /todo lisent planned_operation.responsible_source et
        # responsible_member_id (migrations 20261025000000_responsible_source
        # et 20261025010000_backfill_responsible_source_from_owner) : une
        # colonne manquante ou un backfill cassé y apparaîtrait comme une
        # erreur HTTP/schéma. Lecture seule, foyer de démo existant, aucune
        # donnée créée/modifiée.
        run: |
          set -o pipefail
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('login.json','utf8')).accessToken)")

          code=$(curl -sS -o planning.json -w "%{http_code}" "${{ github.event.inputs.api_url }}/planning?months=6" \
            -H "Authorization: Bearer $TOKEN")
          echo "GET /planning HTTP $code"
          test "$code" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('planning.json','utf8')); console.log('planning OK, clefs top-niveau :', Object.keys(d));"

          code=$(curl -sS -o todo.json -w "%{http_code}" "${{ github.event.inputs.api_url }}/todo" \
            -H "Authorization: Bearer $TOKEN")
          echo "GET /todo HTTP $code"
          test "$code" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('todo.json','utf8')); console.log('todo OK, clefs top-niveau :', Object.keys(d));"

          ! grep -io "does not exist\|internal server error\|column.*responsible" planning.json todo.json

      - name: Aucune référence à localhost dans les réponses publiques
        run: |
          ! grep -io "localhost" signup.json verify.json body.json login.json planning.json todo.json
