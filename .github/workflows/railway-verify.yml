name: Railway — Vérification publique (health + smoke test OTP)

# Exécuté depuis un runner GitHub Actions (accès réseau normal, contrairement
# au bac à sable) pour prouver que le backend est réellement joignable
# publiquement — jamais depuis localhost/le conteneur lui-même.
# Lançable à la main (workflow_dispatch) OU appelé par
# staging-post-deploy.yml (workflow_call) après chaque push sur
# claude/finance-maison-v1, avant android-e2e.
on:
  workflow_call:
    inputs:
      api_url:
        type: string
        required: true
      demo_pin_transition:
        type: boolean
        default: false
      expected_commit:
        description: "Commit attendu sur le backend (champ commit de /health) avant toute vérification."
        type: string
        default: ""
    secrets:
      E2E_PIN:
        required: true
      E2E_LEGACY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL HTTPS publique du backend (sans slash final), ex. https://d-penses-production.up.railway.app"
        required: true
      demo_pin_transition:
        description: >
          UNE SEULE FOIS, après le déploiement du code à 6 chiffres : fait passer
          demo@finance-maison.local de son ancien mot de passe au code du secret
          E2E_PIN via le parcours applicatif normal (POST /auth/login puis
          POST /auth/pin). Sans effet si le compte utilise déjà ce code.
        required: false
        type: boolean
        default: false
      expected_commit:
        description: "Optionnel : commit attendu sur le backend (/health) — la vérification attend qu'il soit déployé."
        required: false
        default: ""

env:
  DEMO_EMAIL: demo@finance-maison.local
  # Code personnel à 6 chiffres du compte démo : secret GitHub, jamais dans Git.
  E2E_PIN: ${{ secrets.E2E_PIN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre que le backend serve le commit attendu (déploiement + migrations terminés)
        if: ${{ inputs.expected_commit != '' }}
        # deploy:start exécute `prisma migrate deploy` AVANT de démarrer le
        # serveur : si /health répond avec ce commit, la migration est appliquée.
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          deadline=$(( $(date +%s) + 30 * 60 ))
          while true; do
            served=$(curl -sS --max-time 10 "${{ inputs.api_url }}/health" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(String(JSON.parse(d).commit))}catch{process.stdout.write('indisponible')}})" || true)
            echo "Commit servi : ${served:-indisponible} — attendu : $EXPECTED_COMMIT"
            [ "$served" = "$EXPECTED_COMMIT" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Le backend ne sert pas le commit attendu après 30 min (déploiement Railway en échec, migration bloquante, ou RAILWAY_GIT_COMMIT_SHA absent)."
              exit 1
            fi
            sleep 20
          done
          echo "Déploiement STAGING terminé (migrations appliquées) pour $EXPECTED_COMMIT."

      - name: GET /health
        run: |
          set -o pipefail
          code=$(curl -sS -o body.json -w "%{http_code}" "${{ inputs.api_url }}/health")
          echo "HTTP $code"
          cat body.json
          echo
          test "$code" = "200"

      - name: Smoke test auth — signup public (aucun token/secret impliqué)
        run: |
          set -o pipefail
          email="railway-smoke+$(date +%s)@example.com"
          echo "Email de test jetable : $email"
          # Compte jetable jamais confirmé : code aléatoire non trivial, non journalisé.
          pin=$(node -e "let p;do{p=String(require('crypto').randomInt(0,1e6)).padStart(6,'0')}while(/^(\d)\1{5}$/.test(p)||'01234567890'.includes(p)||'98765432109'.includes(p));process.stdout.write(p)")
          code=$(curl -sS -o signup.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/auth/signup" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pin\",\"firstName\":\"Smoke\",\"lastName\":\"Test\"}")
          echo "HTTP $code"
          cat signup.json
          echo
          test "$code" = "201"
          grep -q '"requiresEmailVerification":true' signup.json

      - name: Smoke test auth — verify-email-otp avec un code volontairement invalide (prouve le pipeline complet sans connaître le vrai code reçu par email)
        run: |
          set -o pipefail
          email="railway-smoke+$(date +%s)-b@example.com"
          pin=$(node -e "let p;do{p=String(require('crypto').randomInt(0,1e6)).padStart(6,'0')}while(/^(\d)\1{5}$/.test(p)||'01234567890'.includes(p)||'98765432109'.includes(p));process.stdout.write(p)")
          curl -sS -o /dev/null -w "signup: %{http_code}\n" -X POST "${{ inputs.api_url }}/auth/signup" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pin\",\"firstName\":\"Smoke\",\"lastName\":\"Test\"}"
          code=$(curl -sS -o verify.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/auth/verify-email-otp" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"code\":\"000000\"}")
          echo "HTTP $code"
          cat verify.json
          echo
          test "$code" = "400"
          grep -q "invalide ou a expiré" verify.json

      - name: Vérifier le secret E2E_PIN (code du compte démo)
        run: |
          if ! [[ "$E2E_PIN" =~ ^[0-9]{6}$ ]]; then
            echo "::error::Le secret GitHub E2E_PIN est absent ou n'est pas un code à 6 chiffres."
            exit 1
          fi
          echo "E2E_PIN présent (valeur masquée)."

      - name: Compte démo — passage au code à 6 chiffres (une seule fois, via /auth/login + /auth/pin)
        if: ${{ inputs.demo_pin_transition }}
        # Parcours applicatif normal, jamais d'écriture directe de password_hash.
        # Idempotent : si le code E2E_PIN fonctionne déjà, rien n'est modifié.
        # Aucun corps de réponse (jetons) ni aucun credential n'est affiché.
        env:
          # Secret TEMPORAIRE : ancien mot de passe du compte démo, utilisé
          # uniquement pour cette transition initiale ; à supprimer ensuite.
          DEMO_LEGACY_PASSWORD: ${{ secrets.E2E_LEGACY_PASSWORD }}
        run: |
          set -o pipefail
          API="${{ inputs.api_url }}"
          body() { node -e "process.stdout.write(JSON.stringify({email:process.env.DEMO_EMAIL,password:process.argv[1]}))" "$1"; }
          field() { node -e "const d=JSON.parse(require('fs').readFileSync('$1','utf8'));process.stdout.write(String(d['$2']))"; }

          code=$(curl -sS -o pin-login.json -w "%{http_code}" -X POST "$API/auth/login" -H "Content-Type: application/json" -d "$(body "$E2E_PIN")")
          if [ "$code" = "200" ] && [ "$(field pin-login.json mustSetPin)" = "false" ]; then
            rm -f pin-login.json
            echo "Le compte démo utilise déjà le code E2E_PIN — aucune modification."
            exit 0
          fi

          if [ -z "$DEMO_LEGACY_PASSWORD" ]; then
            echo "::error::Transition requise mais le secret temporaire E2E_LEGACY_PASSWORD est absent."
            exit 1
          fi
          code=$(curl -sS -o legacy-login.json -w "%{http_code}" -X POST "$API/auth/login" -H "Content-Type: application/json" -d "$(body "$DEMO_LEGACY_PASSWORD")")
          echo "Connexion avec l'ancien mot de passe : HTTP $code"
          test "$code" = "200"
          test "$(field legacy-login.json mustSetPin)" = "true"
          TOKEN=$(field legacy-login.json accessToken)

          payload=$(node -e "process.stdout.write(JSON.stringify({currentCredential:process.env.DEMO_LEGACY_PASSWORD,newPin:process.env.E2E_PIN}))")
          code=$(curl -sS -o set-pin.json -w "%{http_code}" -X POST "$API/auth/pin" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "$payload")
          echo "POST /auth/pin : HTTP $code"
          test "$code" = "200"

          code=$(curl -sS -o pin-login.json -w "%{http_code}" -X POST "$API/auth/login" -H "Content-Type: application/json" -d "$(body "$E2E_PIN")")
          echo "Connexion avec le nouveau code : HTTP $code"
          test "$code" = "200"
          test "$(field pin-login.json mustSetPin)" = "false"
          rm -f pin-login.json legacy-login.json set-pin.json
          echo "Compte démo passé au code à 6 chiffres (ancien mot de passe désormais refusé) — le secret E2E_LEGACY_PASSWORD peut être supprimé."

      - name: Login compte de démonstration Finance Maison (prouve seed + schéma + auth)
        # Code à 6 chiffres du secret E2E_PIN. Les tokens JWT retournés ne sont
        # jamais affichés dans les logs — seule leur présence est vérifiée.
        run: |
          set -o pipefail
          payload=$(node -e "process.stdout.write(JSON.stringify({email:process.env.DEMO_EMAIL,password:process.env.E2E_PIN}))")
          code=$(curl -sS -o login.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "HTTP $code"
          test "$code" = "201" || test "$code" = "200"
          grep -q '"accessToken"' login.json
          grep -q '"refreshToken"' login.json
          grep -q '"mustSetPin":false' login.json
          echo "Login démo OK — accessToken/refreshToken présents (valeurs non journalisées)"

      - name: /planning et /todo répondent sans erreur (migrations responsible_source appliquées)
        # /planning et /todo lisent planned_operation.responsible_source et
        # responsible_member_id (migrations 20261025000000_responsible_source
        # et 20261025010000_backfill_responsible_source_from_owner) : une
        # colonne manquante ou un backfill cassé y apparaîtrait comme une
        # erreur HTTP/schéma. Lecture seule, foyer de démo existant, aucune
        # donnée créée/modifiée.
        run: |
          set -o pipefail
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('login.json','utf8')).accessToken)")

          code=$(curl -sS -o planning.json -w "%{http_code}" "${{ inputs.api_url }}/planning?months=6" \
            -H "Authorization: Bearer $TOKEN")
          echo "GET /planning HTTP $code"
          test "$code" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('planning.json','utf8')); console.log('planning OK, clefs top-niveau :', Object.keys(d));"

          code=$(curl -sS -o todo.json -w "%{http_code}" "${{ inputs.api_url }}/todo" \
            -H "Authorization: Bearer $TOKEN")
          echo "GET /todo HTTP $code"
          test "$code" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('todo.json','utf8')); console.log('todo OK, clefs top-niveau :', Object.keys(d));"

          ! grep -io "does not exist\|internal server error\|column.*responsible" planning.json todo.json

      - name: "Smoke test fonctionnel : échéance payée/partielle/modifiée (lot refonte Planning/À faire)"
        # Couvre exactement §20/§40 du lot : créer une échéance, la payer
        # partiellement PUIS totalement, puis la MODIFIER (augmenter le
        # prévu au-delà du déjà-payé) SANS jamais appeler unrealize — le
        # backend doit accepter directement l'édition d'une occurrence
        # REALIZED et la rebasculer en PENDING en conservant le paiement
        # déjà enregistré. Données créées/nettoyées exclusivement dans le
        # foyer de démonstration (jamais les données réelles de l'utilisateur).
        run: |
          set -o pipefail
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('login.json','utf8')).accessToken)")
          AUTH=(-H "Authorization: Bearer $TOKEN")
          TODAY=$(date +%F)

          echo "--- GET /accounts (choisir un compte du foyer démo) ---"
          code=$(curl -sS -o accounts.json -w "%{http_code}" "${{ inputs.api_url }}/accounts" "${AUTH[@]}")
          echo "HTTP $code"
          test "$code" = "200"
          ACC=$(node -e "const a=JSON.parse(require('fs').readFileSync('accounts.json','utf8')); if(!a.length) throw new Error('aucun compte dans le foyer démo'); console.log(a[0].id)")
          echo "Compte utilisé : $ACC"

          echo "--- POST /planned-operations (échéance non payée, PENDING) ---"
          code=$(curl -sS -o created.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/planned-operations" "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"EXPENSE\",\"label\":\"CI Smoke Test\",\"expectedDate\":\"$TODAY\",\"expectedAmount\":\"1000\",\"sourceAccountId\":\"$ACC\"}")
          echo "HTTP $code"
          cat created.json; echo
          test "$code" = "201"
          grep -q '"status":"PENDING"' created.json
          PID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('created.json','utf8')).id)")
          echo "Échéance de test : $PID"

          echo "--- POST /planned-operations/$PID/partial-realize (paiement partiel 400/1000) ---"
          code=$(curl -sS -o partial.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/planned-operations/$PID/partial-realize" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d '{"actualAmount":"400"}')
          echo "HTTP $code"
          test "$code" = "201"

          echo "--- GET /planning : vérifie le reste 600 DH (paiement partiel conservé) ---"
          code=$(curl -sS -o planning2.json -w "%{http_code}" "${{ inputs.api_url }}/planning?months=1" "${AUTH[@]}")
          test "$code" = "200"
          node -e "
            const d=JSON.parse(require('fs').readFileSync('planning2.json','utf8'));
            const row=d.depenses.find(r=>Object.values(r.cells).some(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID'));
            if (!row) throw new Error('échéance de test introuvable dans /planning après paiement partiel');
            const cell=Object.values(row.cells).find(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID');
            const occ=cell.singleOccurrence;
            if (occ.status!=='PENDING' || occ.realizedAmount!==400) throw new Error('état inattendu après paiement partiel: '+JSON.stringify(occ));
            console.log('OK — paiement partiel reflété : status=PENDING, déjà payé=400');
          "

          echo "--- POST /planned-operations/$PID/realize (solde le reste, 600, échéance ENTIÈREMENT payée) ---"
          code=$(curl -sS -o realized.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/planned-operations/$PID/realize" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d '{"actualAmount":"600"}')
          echo "HTTP $code"
          test "$code" = "201"

          echo "--- GET /planning : vérifie REALIZED, aucune erreur liée à REALIZED ---"
          code=$(curl -sS -o planning3.json -w "%{http_code}" "${{ inputs.api_url }}/planning?months=1" "${AUTH[@]}")
          test "$code" = "200"
          node -e "
            const d=JSON.parse(require('fs').readFileSync('planning3.json','utf8'));
            const row=d.depenses.find(r=>Object.values(r.cells).some(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID'));
            const cell=Object.values(row.cells).find(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID');
            const occ=cell.singleOccurrence;
            if (occ.status!=='REALIZED' || occ.realizedAmount!==1000) throw new Error('état inattendu après paiement total: '+JSON.stringify(occ));
            console.log('OK — échéance ENTIÈREMENT payée : status=REALIZED, réalisé=1000');
          "

          echo "--- PATCH /planned-operations/$PID (modifier une échéance PAYÉE, SANS unrealize préalable — §20/§40) ---"
          code=$(curl -sS -o modified.json -w "%{http_code}" -X PATCH "${{ inputs.api_url }}/planned-operations/$PID" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d '{"expectedAmount":"1500"}')
          echo "HTTP $code"
          cat modified.json; echo
          test "$code" = "200"
          node -e "
            const d=JSON.parse(require('fs').readFileSync('modified.json','utf8'));
            if (d.status!=='PENDING') throw new Error('la modification aurait dû rebasculer en PENDING (reste à exécuter), reçu: '+JSON.stringify(d));
            if (d.realizedOperationId!==null) throw new Error('realizedOperationId aurait dû être remis à null, reçu: '+d.realizedOperationId);
            console.log('OK — modification directe acceptée (aucun unrealize nécessaire), rebascule en PENDING, reste à exécuter');
          "

          echo "--- GET /planning : vérifie que le paiement de 1000 DH déjà effectué est CONSERVÉ (jamais renversé) ---"
          code=$(curl -sS -o planning4.json -w "%{http_code}" "${{ inputs.api_url }}/planning?months=1" "${AUTH[@]}")
          test "$code" = "200"
          node -e "
            const d=JSON.parse(require('fs').readFileSync('planning4.json','utf8'));
            const row=d.depenses.find(r=>Object.values(r.cells).some(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID'));
            const cell=Object.values(row.cells).find(c=>c.singleOccurrence && c.singleOccurrence.plannedOperationId==='$PID');
            const occ=cell.singleOccurrence;
            if (occ.status!=='PENDING' || occ.realizedAmount!==1000 || occ.expectedAmount!==1500) throw new Error('paiement existant NON conservé après modification: '+JSON.stringify(occ));
            console.log('OK — paiement de 1000 DH conservé intact, reste à payer = 500 DH');
          "

          echo "--- Nettoyage : annule l'échéance de test (foyer démo uniquement) ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${{ inputs.api_url }}/planned-operations/$PID/cancel" "${AUTH[@]}")
          echo "cancel HTTP $code"
          test "$code" = "201"

          echo "--- Récurrence : création + vérification responsibleSource (aucune erreur liée aux récurrences) ---"
          code=$(curl -sS -o rule.json -w "%{http_code}" -X POST "${{ inputs.api_url }}/recurrence-rules" "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"frequency\":\"MONTHLY\",\"anchorDate\":\"$TODAY\",\"kind\":\"EXPENSE\",\"label\":\"CI Smoke Recurrence\",\"expectedAmount\":\"50\",\"sourceAccountId\":\"$ACC\"}")
          echo "HTTP $code"
          cat rule.json; echo
          test "$code" = "201"
          grep -q '"responsibleSource"' rule.json
          RULE_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rule.json','utf8')).id)")
          echo "Règle de test : $RULE_ID"

          echo "--- Nettoyage : désactive la règle de récurrence de test ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH "${{ inputs.api_url }}/recurrence-rules/$RULE_ID" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d "{\"applyFrom\":\"THIS_OCCURRENCE\",\"fromDate\":\"$TODAY\",\"active\":false}")
          echo "deactivate HTTP $code"
          test "$code" = "200"

          ! grep -io "does not exist\|internal server error\|500 " created.json partial.json realized.json modified.json rule.json planning2.json planning3.json planning4.json

      - name: "Recette : navigation temporelle + récurrences à la demande (Planning from=…, À faire lointain)"
        # Rejoue sur STAGING les appels exacts émis par les écrans (barre des
        # mois, sélecteur de période, À faire direct) avec une règle de test
        # créée puis arrêtée dans le seul foyer de démonstration.
        env:
          API_URL: ${{ inputs.api_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const API = process.env.API_URL;
          const TOKEN = JSON.parse(fs.readFileSync('login.json', 'utf8')).accessToken;
          const H = { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
          const LABEL = `CI Recette Récurrence ${process.env.RUN_ID}`;
          const req = async (method, path, body) => {
            const res = await fetch(API + path, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
            const text = await res.text();
            if (/internal server error|does not exist/i.test(text)) throw new Error(`${method} ${path} : erreur serveur ${text}`);
            return { status: res.status, body: text ? JSON.parse(text) : null };
          };
          const ok = async (method, path, body, expected = 200) => {
            const r = await req(method, path, body);
            if (r.status !== expected) throw new Error(`${method} ${path} -> HTTP ${r.status} (attendu ${expected}) ${JSON.stringify(r.body)}`);
            console.log(`OK ${method} ${path} -> ${r.status}`);
            return r.body;
          };
          const shift = (k, n) => { const [y, m] = k.split('-').map(Number); const i = y * 12 + m - 1 + n; return `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}`; };
          const assert = (cond, msg) => { if (!cond) throw new Error(msg); console.log('  ✓ ' + msg); };
          const cellOf = (p, month) => { const row = [...p.revenus, ...p.depenses, ...p.epargne].find((r) => r.label === LABEL); return row && row.cells[month]; };
          const storedByDate = async () => {
            const all = await ok('GET', '/planned-operations');
            const mine = all.filter((p) => p.label === LABEL);
            const counts = {};
            for (const p of mine) counts[p.expectedDate.slice(0, 10)] = (counts[p.expectedDate.slice(0, 10)] || 0) + 1;
            return counts;
          };

          (async () => {
            // 1. Contrat déployé : currentMonth présent = nouveau backend actif.
            const def = await ok('GET', '/planning?months=6');
            const cur = def.currentMonth;
            assert(/^\d{4}-\d{2}$/.test(cur || ''), `currentMonth renvoyé par /planning (${cur}) : commit avec from=… bien déployé`);
            assert(def.months[0] === cur && def.months.length === 6, 'plage par défaut = 6 mois depuis le mois courant');
            const explicit = await ok('GET', `/planning?months=6&from=${cur}`);
            assert(JSON.stringify(explicit) === JSON.stringify(def), '/planning?from=<mois courant> identique au Planning par défaut');
            await ok('GET', '/planning?months=6&from=2027-13', undefined, 400);
            const todoNow = await ok('GET', '/todo');
            assert(todoNow.month === cur, `/todo mois courant = ${cur}`);

            // 2. Règle de test (foyer démo) : mensuelle sans fin, le 10 à partir du mois prochain.
            const accounts = await ok('GET', '/accounts');
            const anchor = `${shift(cur, 1)}-10`;
            const rule = await ok('POST', '/recurrence-rules', { frequency: 'MONTHLY', anchorDate: anchor, kind: 'EXPENSE', label: LABEL, expectedAmount: '123', sourceAccountId: accounts[0].id, includeInTodo: true }, 201);
            try {
              // 3. Navigation Planning : mois voisin (swipe/toucher) puis sélection directe à +20 mois (fenêtre F-1|F|F+1).
              const next = await ok('GET', `/planning?months=6&from=${shift(cur, 1)}`);
              assert(next.months[0] === shift(cur, 1) && next.months.length === 6, 'navigation mois suivant : plage décalée d’un mois');
              const F = shift(cur, 20);
              for (let i = 0; i < 3; i++) await ok('GET', `/planning?months=6&from=${shift(F, -1)}`);
              const far = await ok('GET', `/planning?months=6&from=${shift(F, -1)}`);
              assert(far.months[1] === F, `sélection directe ${F} : mois central de la fenêtre`);
              for (const m of [shift(F, -1), F, shift(F, 1)]) {
                const c = cellOf(far, m);
                assert(c && c.displayAmount === 123 && c.singleOccurrence && c.singleOccurrence.plannedOperationId, `récurrence présente et actionnable en ${m}`);
              }
              assert(far.synthese[F].resteDepenses === null, 'reste à exécuter absent hors mois courant');

              // 4. À faire directement à +30 mois, jamais ouvert dans le Planning.
              const G = shift(cur, 30);
              for (let i = 0; i < 3; i++) await ok('GET', '/todo?monthsOffset=30');
              const todoFar = await ok('GET', '/todo?monthsOffset=30');
              assert(todoFar.month === G, `/todo?monthsOffset=30 -> ${G}`);
              const action = todoFar.pending.find((a) => a.label === LABEL);
              assert(action && action.expectedAmount === 123 && action.remaining === 123, `récurrence présente dans À faire ${G} sans passage par le Planning`);
              const planningG = await ok('GET', `/planning?months=3&from=${shift(G, -1)}`);
              const cG = cellOf(planningG, G);
              assert(cG && cG.singleOccurrence.plannedOperationId === action.plannedOperationId, 'Planning et À faire désignent la même occurrence (même id)');

              // 5. Aucun doublon, aucun mois intermédiaire écrit, retour au mois courant.
              const counts = await storedByDate();
              assert(Object.values(counts).every((n) => n === 1), `une seule occurrence par date (${Object.keys(counts).length} dates)`);
              for (const n of [14, 15, 16, 17, 18]) assert(!counts[`${shift(cur, n)}-10`], `mois intermédiaire ${shift(cur, n)} non matérialisé`);
              for (const m of [shift(F, -1), F, shift(F, 1), G]) assert(counts[`${m}-10`] === 1, `${m} matérialisé une fois`);
              const back = await ok('GET', `/planning?months=6&from=${shift(cur, -1)}`);
              assert(back.months[1] === cur && back.synthese[cur].resteDepenses !== null, 'retour au mois courant : reste à exécuter sur le mois courant');
              const defAfter = await ok('GET', '/planning?months=6');
              assert(defAfter.currentMonth === cur && defAfter.months.join() === def.months.join(), 'Planning par défaut inchangé après les consultations lointaines');
            } finally {
              // 6. Nettoyage : arrêt de la série de test (occurrences PENDING annulées, règle inactive).
              await ok('PATCH', `/recurrence-rules/${rule.id}`, { applyFrom: 'THIS_AND_FOLLOWING', fromDate: anchor, active: false });
            }
            const stopped = await ok('GET', `/planning?months=3&from=${shift(cur, 25)}`);
            assert(!cellOf(stopped, shift(cur, 26)) || cellOf(stopped, shift(cur, 26)).status === 'EMPTY', 'série arrêtée : plus aucune occurrence active après nettoyage');
            console.log('RECETTE NAVIGATION + RÉCURRENCES : OK');
          })().catch((e) => { console.error('ÉCHEC : ' + e.message); process.exit(1); });
          EOF

      - name: Aucune référence à localhost dans les réponses publiques
        run: |
          ! grep -io "localhost" signup.json verify.json body.json login.json planning.json todo.json
